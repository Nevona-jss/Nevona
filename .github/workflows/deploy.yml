name: Deploy to GitHub Pages

on:
  # Har push'da main branch'ga ishga tushadi
  push:
    branches: [main]
  
  # Qo'lda ham ishga tushirish mumkin (Actions tab'dan)
  workflow_dispatch:

# Permission'lar — GitHub Pages'ga deploy qilish uchun
permissions:
  contents: read
  pages: write
  id-token: write

# Bir vaqtning o'zida faqat bitta deploy ishlasin
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1-job: Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add CNAME for custom domain
        run: echo "nevona.uz" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 2-job: Deploy
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
